<div id="start-menu">

    <button id="dark mode" (click)=toggleDarkMode()><img src="assets/img/Moon.png" alt="Toggle dark mode"></button>
    <!-- <button id="dark mode">Dark mode</button> -->
  </div>
  <div id="app-list">
    <app-start-app [appName]="'Notepad'" />
    <app-start-app [appName]="'Calculator'" />
    <app-start-app [appName]="'Calendar'"/>
    <app-start-app [appName]="'FileExplorer'" />
  </div>
</div>
