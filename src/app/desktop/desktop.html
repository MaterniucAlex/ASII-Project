<main [style.background-image]="'url(' + aspectService.wallpaper() + ')'" [style.display]=aspectService.display()>
  <app-taskbar />
  <section id="desktop">
    <app-app [appName]="'Notepad'"/>
    <app-app [appName]="'Calculator'"/>
    <app-app [appName]="'Calendar'"/>
  </section>
  <section id="windows">
    @for (app of appService.openedAppsList(); track app.appId)
    {
      <app-window [app]=app [style.z-index]=app.zIndex [style.display]=app.display/>
    }
  </section>
</main>
