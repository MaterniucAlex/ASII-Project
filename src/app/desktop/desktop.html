<main>
  <div id="taskbar">
    <div id="taskbar-app-list"></div>
    <p id="clock">12:00</p>

    <!--This should not be here da e pusa doar pt layout, pana gasim cu ce sa o inlocuim-->
    <div id="taskbar-app-list"></div>

  </div>
  <section id="desktop">
    <app-app [appName]="'Notepad'"/>
    <app-app [appName]="'Calculator'"/>
    <app-app [appName]="'Calendar'"/>
  </section>
  <section id="windows">
    @for (app of appService.openedAppsList(); track app.appId)
    {
      <app-window [app]=app [style.z-index]=app.zIndex/>
    }
  </section>
</main>
