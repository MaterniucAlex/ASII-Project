<main [style.background-image]="'url(' + aspectService.wallpaper() + ')'" [style.opacity]=aspectService.screenOpacity()>

  @if(!appService.isMobile){
    <app-taskbar />
  }
  @else if(isMenuOpen()){
    <app-mobile-menu />
  }
  <section id="desktop">
    <app-app [appName]="'Notepad'"/>
    <app-app [appName]="'Calculator'"/>
    <app-app [appName]="'Calendar'"/>
    <app-app [appName]="'FileExplorer'"/>
    <a href="https://www.youjustgot.com/?fbclid=PAT01DUANkhoFleHRuA2FlbQIxMAABp-2Hoxj4QJ93rPT9d7dWZj4vyGuzRZ1EL8oW2PjObuve_ANXf0XjS7X58Gii_aem_W4xoJVQgrqkYRdZp2EZ1iA" target="_"><app-app [appName]="'Terminal'"/></a>
  </section>
  <section id="windows">
    @for (app of appService.openedAppsList(); track app.appId)
    {
      <app-window [app]=app [style.z-index]=app.zIndex [style.display]=app.display/>
    }
  </section>
  @if(appService.isMobile){
    <div id="mobile-buttons">
      <button (click)="openAppMenu()">▢</button>
      <button (click)="toggleAllAppsVisibility()">◯</button>
      <button (click)="goBack()">◁</button>
    </div>
  }
</main>
