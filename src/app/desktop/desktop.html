<main>
  @if(!appService.isMobile){
    <app-taskbar />
  }
  <section id="desktop">
    <app-app [appName]="'Notepad'"/>
    <app-app [appName]="'Calculator'"/>
    <app-app [appName]="'Calendar'"/>
  </section>
  <section id="windows">
    @for (app of appService.openedAppsList(); track app.appId)
    {
      <app-window [app]=app [style.z-index]=app.zIndex [style.display]=app.display/>
    }
  </section>
  @if(appService.isMobile){
    <div id="mobile-buttons">
      <button (click)="openAppMenu()">▢</button>
      <button (click)="toggleAllAppsVisibility()">◯</button>
      <button (click)="goBack()">◁</button>
    </div>
  }
</main>
