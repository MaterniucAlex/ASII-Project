<div class="file-explorer">
  <div class="toolbar">
    <button (click)="goBack()" [disabled]="service.currentPath() === '/'">←</button>
    <input type="text" [value]="service.currentPath()" readonly />

    <button (click)="createFolderPrompt()">New Folder</button>

    <button (click)="fileInput.click()">Add Folder</button>
    <input type="file" #fileInput style="display: none;" (change)="uploadFile($event)" />

    <button (click)="service.refresh()">Refresh</button>
  </div>

  <div class="items-list">
    @for (item of service.currentItems(); track item._id) {
      <div class="file-item" (dblclick)="service.openItem(item, notepad)" (contextmenu)="showContextMenu($event, item)">
         <img [src]="item.isFolder ? 'assets/img/Folder.png' : 'assets/img/File.png'" alt="icon" />
         <p>{{ item.name }}</p>
      </div>
    }
    @empty {
      <p class="empty-message">Empty Folder</p>
    }
  </div>
</div>
