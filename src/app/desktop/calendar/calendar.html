<div id="calendar-container">
  <div id="date-picker">
    <select name="months" id="month-input" (change)="selectedMonth.set(+$any($event.target).value)">
      @for (month of months(); track month.monthNum) {
        <option value="{{ month.monthNum }}" [selected]="month.monthNum === selectedMonth()">
          {{ month.monthName }}
        </option>
      }
    </select>

    <input id="year-input" type="number" [value]="selectedYear()" (input)="selectedYear.set(+$any($event.target).value)" />
  </div>

  <div id="week-days">
    @for (weekDay of weekDays; track $index) {
      <div>{{ weekDay }}</div>
    }
  </div>

  <div id="month-days">
    @for (empty of leadingBlanks(); track $index){
      <div style="box-sizing: border-box;"> </div>
    }

    @for (day of monthDays(); track $index) {
      <div class="day">
        {{ day }}
      </div>
    }
  </div>
</div>
